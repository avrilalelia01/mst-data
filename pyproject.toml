[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopee-sales-analyzer"
version = "0.1.0"
description = "Shopee seller analytics: KPI computation, recommendations, and Power BI exports"
requires-python = ">=3.11"
dependencies = [
    "requests==2.32.3",
    "apscheduler==3.10.4",
    "pydantic>=2.7.0,<3",
    "pyyaml==6.0.2",
    "python-json-logger==2.0.7",
    "pandas==2.2.2",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary==2.9.9",
]
dev = [
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
    "hypothesis==6.103.2",
]

[project.scripts]
shopee-analyzer = "shopee_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shopee_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "integration: marks tests that require live Shopee sandbox credentials (deselect with -m 'not integration')",
]

[tool.coverage.run]
source = ["shopee_analyzer"]
omit = ["tests/*"]
